<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page moved</title>
  <script>
    (function () {
      var oldPrefix = "/SAM2GUIfor3Drecon";
      var path = window.location.pathname;

      if (path === oldPrefix || path.indexOf(oldPrefix + "/") === 0) {
        var suffix = path.slice(oldPrefix.length);
        var target = "https://satorumuro.github.io/SegRef3D" +
          suffix + window.location.search + window.location.hash;
        window.location.replace(target);
      }
    }());
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>The requested page could not be found.</p>
  <p><a href="https://satorumuro.github.io/SegRef3D/">Open SegRef3D</a></p>
</body>
</html>
